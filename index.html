    <body>

     <div class="music-player">
         <h1 class="music-name">Raabta</h1>
         <p class="artist-name">Arijit Singh</p>
         <audio src="AUDIO/Title track.mp3.mp3" id="audio"></audio>
         <div class="disk play">
     </div>
         <div class="song-slider">
             <input type="range" value="0" class="seek-bar">
             <span class="current-time">00:00</span>
             <span class="song-duration">00:00</span>
         </div>

         <div class="controls">
             <button class="btn backward-btn"> < </button>
             <button class="play-btn pause">
                 <span></span>
                 <span></span>
             </button>
             <button class="btn forward-btn"> > </button>
         </div>

     </div>
